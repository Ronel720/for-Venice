<!DOCTYPE html>
<html lang="en">
<head>

  <title>I'm really Sorry my beloved Venice! 🥺❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card" id="mainCard">
    <img class="gif" id="displayGif" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp1eHNtdWZicnZ3bmNxdXJ6eTBpdjJ5dzVldzRmcWpxZ3AwZ3k1diZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/L9543RG8Bui9A/giphy.gif" alt="Sad Bear">
    <h1 id="titleText">I'm so, so sorry... 🥺</h1>
    <p id="messageText">I messed up and I feel terrible about it. You mean the absolute world to me, and the last thing I ever want to do is hurt you. Will you forgive me?</p>

    <div class="btn-group" id="btnGroup">
      <button class="yes-btn" id="yesBtn" onclick="acceptApology()">Yes 💖</button>
      <button class="no-btn" id="noBtn" onclick="handleNoClick()">No 💔</button>
    </div>
  </div>

  <script src="script.js"></script>
